services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-cygen}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-https://localhost}
        REACT_APP_APPLY_URL: ${REACT_APP_APPLY_URL:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/cron.sh"]
    environment:
      WEBHOOK_CRON_SECRET: ${WEBHOOK_CRON_SECRET}
    volumes:
      - ./deploy/cron.sh:/cron.sh:ro
    depends_on:
      - backend

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

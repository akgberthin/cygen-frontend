        <script>
            (function () {
                try {
                    var t = localStorage.getItem("cygen-theme") || "dark";
                    var d = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    var c = document.documentElement;
                    c.classList.remove("dark", "light");
                    c.classList.add(d ? "dark" : "light");
                    c.style.colorScheme = d ? "dark" : "light";
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute("content", d ? "#07090f" : "#f7f5f0");
                } catch (e) {
                    document.documentElement.classList.add("dark");
                }
            })();
        </script>

            <h1>CYGEN Equities — become the full owner of the home you live in</h1>
            <p>CYGEN helps you become the full owner of your home through a partnership, not a mortgage. You live in the home as the Limited Partner; CYGEN's fund joins as the General Partner and supplies the capital. The home is held in a trust or SPV until your equity reaches 100%. A person at CYGEN reviews every application; nothing is decided by software alone.</p>
